# Supabase pauses free projects after about a week with no activity.
# This reads one row from the board every Monday so the database stays awake.
# If the database is already paused, the run fails and GitHub emails you.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC (9:17 AM in Georgia during daylight time)
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the board
        env:
          SUPABASE_URL: https://lbgsohxougbqrjjdkspl.supabase.co
          # Publishable key: the same one the public website already uses.
          SUPABASE_KEY: sb_publishable_HS-6m3YyZPVbmoQnNu7-fg_Dr115hMp
        run: |
          status=$(curl -sS -o body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase answered HTTP $status"
          head -c 300 body.txt; echo
          if [ "$status" != "200" ]; then
            echo "::error::The board's database did not answer normally. It may be paused; restore it from the Supabase dashboard."
            exit 1
          fi
