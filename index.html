<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Belladrum Idea Board</title>
<meta name="description" content="Ideas, checklist and property photos for our home build.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#ECEFEA; --surface:#FFFFFF; --ink:#1E2A2C; --muted:#5F6B68; --line:#D3D9D3;
  --accent:#34574A; --accent-ink:#FFFFFF; --shade:rgba(20,28,27,.62);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{color-scheme:dark;--bg:#131817;--surface:#1C2321;--ink:#E4EAE6;--muted:#97A39E;--line:#2E3835;--accent:#8EB6A2;--accent-ink:#0F1614;--shade:rgba(0,0,0,.75)}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:env(safe-area-inset-top,0px) 48px}
img{max-width:100%}
.wrap{max-width:1400px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:18px 12px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.head{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font:700 clamp(22px,3.2vw,30px)/1.1 var(--display);letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%}
.tab{appearance:none;border:0;background:transparent;color:var(--ink);font:600 14px var(--body);padding:7px 14px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.tab .n{font:500 12px var(--mono);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .n{color:var(--accent-ink);opacity:.8}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{margin:14px 0 0;color:var(--muted);font-size:13px}
.grid{display:flex;gap:14px;align-items:flex-start;margin-top:16px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{margin:0;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);cursor:zoom-in}
.card img{display:block;width:100%;height:auto;background:var(--line)}
.card .note{padding:8px 10px 0;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .lab{display:block;padding:6px 10px 8px;font:500 12px var(--mono);color:var(--muted)}
.cl{margin-top:16px;columns:3 320px;column-gap:14px}
.sec{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:14px 14px 10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2{font:700 17px/1.2 var(--display);margin:0}
.cnt{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.sec ul{list-style:none;margin:6px 0 0;padding:0}
.sec li{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);line-height:1.4}
.sec li:first-child{border-top:0}
.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:4px;margin-top:1px;display:grid;place-items:center;font-size:12px;color:var(--accent-ink)}
.done .box{background:var(--accent);border-color:var(--accent)}
.done span:last-child{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;margin:6px 0 0}
.lb{position:fixed;inset:0;background:var(--shade);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.lb-inner{background:var(--surface);border-radius:12px;overflow:auto;max-height:100%;max-width:min(620px,100%);display:flex;flex-direction:column}
.lb-inner img{display:block;max-height:calc(100dvh - 170px);width:auto;max-width:100%;margin:0 auto;background:var(--line)}
.lb-note{padding:12px 12px 0;white-space:pre-wrap}
.lb-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px}
.lb-bar .lab{font:500 13px var(--mono);color:var(--muted)}
.act{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px var(--body);padding:5px 11px;border-radius:999px;cursor:pointer}
.nav{display:flex;gap:6px}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:560px){
  .tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
  .tab{padding:6px 6px;font-size:13px;gap:5px}
  .grid,.col{gap:10px}
}
</style>
</head>
<body>
<header>
  <div class="head">
    <div>
      <h1>Belladrum Idea Board</h1>
      <div class="sub">Ideas, our checklist, and the property as it is today</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="ideas" aria-selected="true">Ideas <span class="n" id="n-ideas"></span></button>
      <button class="tab" role="tab" data-view="checklist" aria-selected="false">Checklist <span class="n" id="n-check"></span></button>
      <button class="tab" role="tab" data-view="property" aria-selected="false">Property <span class="n" id="n-prop"></span></button>
    </div>
  </div>
</header>
<div class="wrap">
  <p class="status" id="status">Loading…</p>
  <div class="grid" id="grid"></div>
  <div class="cl" id="cl" hidden></div>
  <footer id="foot"></footer>
</div>
<div class="lb" id="lb" hidden>
  <div class="lb-inner" role="dialog" aria-modal="true" aria-label="Photo">
    <img id="lb-img" alt="">
    <div class="lb-note" id="lb-note" hidden></div>
    <div class="lb-bar">
      <span class="lab" id="lb-lab"></span>
      <div class="nav">
        <button class="act" id="lb-prev" aria-label="Previous">←</button>
        <button class="act" id="lb-next" aria-label="Next">→</button>
        <button class="act" id="lb-close" aria-label="Close">✕</button>
      </div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let D=null, view=["#checklist","#property"].includes(location.hash)?location.hash.slice(1):"ideas", list=[], at=0, cols=0;
function colCount(){const w=$("grid").clientWidth||innerWidth;return w<560?2:Math.max(2,Math.min(6,Math.floor((w+14)/250)));}
function items(){return view==="property"?D.property:D.ideas;}
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.view===view));
  const isCl=view==="checklist";
  $("grid").hidden=isCl; $("cl").hidden=!isCl;
  const done=D.checklist.reduce((a,s)=>a+s.items.filter(i=>i.done).length,0), tot=D.checklist.reduce((a,s)=>a+s.items.length,0);
  $("status").textContent=isCl?`${done} of ${tot} items checked off`:view==="property"?`${D.property.length} photos of the property`:`${D.ideas.length} ideas we're keeping`;
  if(isCl){renderCl();return;}
  const its=items(), n=colCount(); cols=n;
  const cs=[],hs=[];
  for(let i=0;i<n;i++){const c=document.createElement("div");c.className="col";cs.push(c);hs.push(0);}
  its.forEach((it,i)=>{
    const k=hs.indexOf(Math.min(...hs));
    const f=document.createElement("figure");f.className="card";
    const img=new Image();img.src=it.src;img.width=it.w;img.height=it.h;img.loading="lazy";img.decoding="async";img.alt=it.note||"Inspiration photo";
    f.append(img);
    if(it.note){const p=document.createElement("div");p.className="note";p.textContent=it.note;f.append(p);}
    const l=document.createElement("span");l.className="lab";l.textContent=it.area||it.label||"";if(l.textContent)f.append(l);
    f.addEventListener("click",()=>openLb(i));
    cs[k].append(f); hs[k]+=it.h/it.w+.12+(it.note?.1:0);
  });
  $("grid").replaceChildren(...cs);
}
function renderCl(){
  $("cl").replaceChildren(...D.checklist.map(s=>{
    const sec=document.createElement("section");sec.className="sec";
    const h=document.createElement("div");h.className="sec-head";
    const t=document.createElement("h2");t.textContent=s.name;
    const c=document.createElement("span");c.className="cnt";c.textContent=s.items.length?s.items.filter(i=>i.done).length+"/"+s.items.length:"";
    h.append(t,c);sec.append(h);
    if(!s.items.length){const p=document.createElement("p");p.className="empty";p.textContent="Nothing here yet.";sec.append(p);}
    else{const ul=document.createElement("ul");s.items.forEach(it=>{const li=document.createElement("li");if(it.done)li.className="done";
      const b=document.createElement("span");b.className="box";b.textContent=it.done?"✓":"";b.setAttribute("aria-label",it.done?"Done":"Not done");
      const x=document.createElement("span");x.textContent=it.text;li.append(b,x);ul.append(li);});sec.append(ul);}
    return sec;
  }));
}
function openLb(i){list=items();at=i;$("lb").hidden=false;syncLb();$("lb-close").focus();}
function syncLb(){const it=list[at];$("lb-img").src=it.src;$("lb-img").alt=it.note||"Inspiration photo";
  $("lb-note").hidden=!it.note;$("lb-note").textContent=it.note||"";$("lb-lab").textContent=(it.area||it.label||"")+`  ${at+1}/${list.length}`;}
function step(d){const j=at+d;if(j>=0&&j<list.length){at=j;syncLb();}}
$("lb-prev").onclick=()=>step(-1);$("lb-next").onclick=()=>step(1);$("lb-close").onclick=()=>$("lb").hidden=true;
$("lb").addEventListener("click",e=>{if(e.target===$("lb"))$("lb").hidden=true;});
addEventListener("keydown",e=>{if($("lb").hidden)return;if(e.key==="Escape")$("lb").hidden=true;else if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.view;history.replaceState(null,"",view==="ideas"?location.pathname:"#"+view);render();scrollTo(0,0);});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(D&&view!=="checklist"&&colCount()!==cols)render();},150);});
fetch("data.json").then(r=>r.json()).then(d=>{D=d;
  $("n-ideas").textContent=d.ideas.length;$("n-prop").textContent=d.property.length;
  const done=d.checklist.reduce((a,s)=>a+s.items.filter(i=>i.done).length,0),tot=d.checklist.reduce((a,s)=>a+s.items.length,0);
  $("n-check").textContent=done+"/"+tot;
  $("foot").textContent="Snapshot updated "+d.updated;
  render();}).catch(()=>{$("status").textContent="The board didn't load. Refresh to try again.";});
</script>
</body>
</html>
