# Supabase pauses free projects after about a week without enough database activity.
# A plain read once a week wasn't counted, so this now makes a tiny database write
# (one timestamp row) twice a day, plus a read of the board.
# If the database is paused or the write fails, the run fails and GitHub emails you.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 * * *"   # every day, 13:17 UTC (morning in Georgia)
    - cron: "47 1 * * *"    # every day, 01:47 UTC (evening in Georgia), in case one run is skipped
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://lbgsohxougbqrjjdkspl.supabase.co
      # Publishable key: the same one the public website already uses.
      SUPABASE_KEY: sb_publishable_HS-6m3YyZPVbmoQnNu7-fg_Dr115hMp
    steps:
      - name: Write a heartbeat row
        run: |
          status=$(curl -sS -o body.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "Heartbeat write: HTTP $status"; head -c 300 body.txt; echo
          if [ "$status" != "200" ]; then
            echo "::error::The heartbeat write failed. If the database is paused, restore it from the Supabase dashboard. If it says keepalive was not found, run keepalive-setup.sql in the SQL Editor."
            exit 1
          fi
      - name: Read one row from the board
        run: |
          status=$(curl -sS -o body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/items?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Board read: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::The board's database did not answer normally."
            exit 1
          fi
